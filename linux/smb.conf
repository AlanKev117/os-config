
# 1. Install samba:
# sudo apt install samba -y
# 2. Edit this file and copy to /etc/samba/smb.conf
# 3. Set samba passsword
# sudo smbpasswd -a [your_username]
# 4. Run and enable service
# sudo systemctl restart smbd
# sudo systemctl enable smbd

[media]
  comment=Access to /media
  path=/media
  writeable=yes
  create mask=644
  directory mask=755
  public=no
  guest ok=no
  force user={USER}
  force group={USER}
  
[mnt]
  comment=Access to /mnt
  path=/mnt
  writeable=yes
  create mask=644
  directory mask=755
  public=no
  guest ok=no
  dfree command=/bin/df
  force user={USER}
  force group={USER}
